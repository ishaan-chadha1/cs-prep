        /* Sidebar */
        .sidebar { width: 320px; flex: 0 0 320px; background: var(--sidebar); color: white; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar h2 { padding: 20px; font-size: 1.1rem; text-align: center; background: #1a252f; border-bottom: 1px solid #34495e; }
        .program-btn { background: none; border: none; color: #bdc3c7; padding: 12px 15px; text-align: left; cursor: pointer; border-bottom: 1px solid #34495e; font-size: 0.9rem; transition: 0.2s; line-height: 1.3; }
        .program-btn:hover { background: #34495e; color: white; }
        .program-btn.active { background: #3498db; color: white; font-weight: bold; border-left: 5px solid #2980b9; }

        /* Main Workspace */
        .workspace { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        
        /* Top: Question Bar */
        .question-bar { padding: 20px; background: white; border-bottom: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 10; min-height: 120px;}
        .question-heading { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
        .question-bar h3 { color: #2980b9; margin-bottom: 10px; font-size: 1.2rem; }
        .question-bar p { font-size: 0.95rem; line-height: 1.5; color: #444; font-weight: 500;}
        .action-button { border: 0; border-radius: 6px; padding: 10px 14px; background: var(--accent); color: white; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .action-button:hover { background: #217dbb; }
        .action-button.secondary { background: #566573; }
        .action-button.secondary:hover { background: #3f4c57; }

        /* Bottom: Split View (Code & Output) */
        .split-view { display: flex; flex: 1; min-height: 0; overflow: hidden; }
        
        /* Left: Code Box */
        .code-panel { flex: 1; min-width: 0; background: #1e1e1e; color: #d4d4d4; overflow: auto; padding: 20px; font-family: Consolas, monospace; font-size: 13.5px; line-height: 1.5; border-right: 2px solid #000; }
        .code-panel pre { margin: 0; white-space: pre-wrap; }
        .code-panel code, .practice-editor { font-family: Consolas, Monaco, monospace; }
        .token-tag, .token-keyword { color: #569cd6; }
        .token-attr, .token-function { color: #dcdcaa; }
        .token-string { color: #ce9178; }
        .token-comment { color: #6a9955; }
        .token-number { color: #b5cea8; }
        .practice-panel { display: none; height: 100%; flex-direction: column; }
        .practice-panel.visible { display: flex; }
        .practice-editor { width: 100%; flex: 1; resize: none; border: 0; outline: 0; background: #111827; color: #e5e7eb; padding: 16px; font-size: 13.5px; line-height: 1.5; tab-size: 2; }
        .practice-toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 0 14px; }
        .practice-note { color: #aab4bf; font: 12px/1.4 'Segoe UI', sans-serif; margin-top: -6px; }
        .practice-message { min-height: 18px; color: #79c7ff; font: 12px 'Segoe UI', sans-serif; }

        /* Right: Output Box */
        .output-panel { flex: 1; min-width: 0; background: white; display: flex; flex-direction: column; }
        .output-panel iframe { width: 100%; height: 100%; border: none; }
        
        .panel-header { background: #e0e0e0; padding: 8px 15px; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #555; }
        @media (max-width: 800px) {
            body { display: block; }
            .sidebar { width: 100%; height: auto; max-height: 260px; }
            .sidebar h2 { position: sticky; top: 0; z-index: 2; }
            .workspace { height: auto; min-height: calc(100vh - 260px); }
            .question-heading { flex-direction: column; }
            .question-heading .action-button { width: 100%; }
            .split-view { display: block; overflow: visible; }
            .code-panel, .output-panel { min-height: 420px; height: 50vh; border-right: 0; border-bottom: 2px solid #000; }
            .output-panel { height: 60vh; }
        }
        @media (max-width: 480px) {
            .program-btn { padding: 10px 12px; }
            .question-bar { padding: 15px; }
            .code-panel { padding: 14px; font-size: 12px; }
            .code-panel .panel-header { margin: -14px -14px 14px -14px !important; }
        }

            let cValue = document.getElementById('c').value;

    <input type="number" id="year" placeholder="Enter Year">
    <button onclick="checkLeap()">Check</button>
    <h3 id="result"></h3>

    <script>
        function checkLeap() {
            let year = parseInt(document.getElementById('year').value);
            let result = document.getElementById('result');
            
            if (isNaN(year)) {
                result.innerText = "Please enter a valid year.";
                return;
            }

            if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
                result.innerText = year + " is a Leap Year.";
            } else {
                result.innerText = year + " is NOT a Leap Year.";
            }
        }

    <h2>Simple Interest Calculator</h2>

    Principal: <input type="number" id="p"><br><br>

    Time (Yrs): <input type="number" id="t"><br><br>
    
    <button onclick="calculateSI()">Calculate</button>
    <h3 id="result"></h3>

    <script>
        function calculateSI() {
            let p = parseFloat(document.getElementById('p').value);
            let r = parseFloat(document.getElementById('r').value);
            let t = parseFloat(document.getElementById('t').value);

            if (isNaN(p) || isNaN(r) || isNaN(t)) {
                document.getElementById('result').innerText = "Enter all values.";
                return;
            }

            let si = (p * r * t) / 100;
            document.getElementById('result').innerText = "Simple Interest: " + si.toFixed(2);
        }
    \x3C/script>
</body>
</html>`

export default function BillCalculator() {
  const [amount, setAmount] = useState(0);
  const [discountPercent, setDiscountPercent] = useState(0);

  const discountAmount = (amount * discountPercent) / 100;
  const finalBill = amount - discountAmount;

  return (
    <div style={{ padding: '20px', fontFamily: 'Arial' }}>
      <h2>Bill Calculator</h2>
      
      <label>Bill Amount ($): </label><br/>
      <input type="number" onChange={(e) => setAmount(Number(e.target.value))} /><br/><br/>

      <label>Discount (%): </label><br/>
      <input type="number" onChange={(e) => setDiscountPercent(Number(e.target.value))} /><br/><br/>

      <div style={{ background: '#eee', padding: '10px' }}>
        <p>Original: $\${amount}</p>
        <p>Saved: $\${discountAmount}</p>
        <h3>Final Payable: $\${finalBill}</h3>
      </div>
    </div>
  );
}`

        }

        function highlightCode(code) {
            const escaped = escapeHtml(decodeCode(code));
            const protectedParts = [];
            const protect = (value, className) => {
                const marker = `___TOKEN_${protectedParts.length}___`;
                protectedParts.push(`<span class="token-${className}">${value}</span>`);
                return marker;
            };

            let highlighted = escaped
                .replace(/(&lt;!--[\s\S]*?--&gt;|\/\/.*$)/gm, match => protect(match, 'comment'))
                .replace(/(&quot;.*?&quot;|&#39;.*?&#39;|`.*?`)/g, match => protect(match, 'string'))
                .replace(/(&lt;\/?[a-zA-Z][^&]*?&gt;)/g, match => protect(match, 'tag'))
                .replace(/\b(function|const|let|var|return|if|else|for|while|new|import|from|export|default|true|false|null)\b/g, match => protect(match, 'keyword'))
                .replace(/\b([A-Za-z_$][\w$]*)(?=\()/g, match => protect(match, 'function'))
                .replace(/\b\d+(?:\.\d+)?\b/g, match => protect(match, 'number'));

            protectedParts.forEach((part, index) => {
                highlighted = highlighted.replace(`___TOKEN_${index}___`, part);
            });
            return highlighted;
        }

        function renderOutput(code) {
            if (!selectedProgram) return;
            if (selectedProgram.type === 'html') {
                iframe.srcdoc = decodeCode(code);
                return;
            }

            const match = code.match(/function\s+([A-Za-z0-9_]+)/);
            const componentName = match ? match[1] : 'App';
            iframe.srcdoc = `
                <!DOCTYPE html><html><head>
                <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin>\x3C/script>
                <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin>\x3C/script>
                <script src="https://unpkg.com/@babel/standalone/babel.min.js">\x3C/script>
                </head><body><div id="root"></div>
                <script type="text/babel">
                    ${code.replace(/export default function/, 'function').replace(/import .*;/g, '')}
                    const root = ReactDOM.createRoot(document.getElementById('root'));
                    root.render(<${componentName} />);
                \x3C/script></body></html>`;
        }

        function setPracticeMessage(message) {
            practiceMessage.innerText = message;
        }

        // --- Render Sidebar ---
        const sidebar = document.getElementById('sidebar');
        programs.forEach(prog => {
            const btn = document.createElement('button');
            btn.className = 'program-btn';
            btn.innerText = prog.title;
            btn.onclick = () => loadProgram(prog, btn);
            sidebar.appendChild(btn);
        });

        // --- Load Program Logic ---
        function loadProgram(prog, btnElement) {
            selectedProgram = prog;
            document.querySelectorAll('.program-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            document.getElementById('q-title').innerText = prog.title;
            document.getElementById('q-desc').innerText = prog.question;
            
            document.getElementById('code-display').innerHTML = highlightCode(prog.code);
            practiceEditor.value = decodeCode(prog.code);
            setPracticeMessage('');
            renderOutput(prog.code);
        }

        practiceToggle.addEventListener('click', () => {
            practiceMode = !practiceMode;
            solutionView.style.display = practiceMode ? 'none' : 'block';
            practiceView.classList.toggle('visible', practiceMode);
            practiceToggle.innerText = practiceMode ? 'View solution' : 'Practice mode';
            if (practiceMode) practiceEditor.focus();
        });

        document.getElementById('run-practice').addEventListener('click', () => {
            if (!practiceEditor.value.trim()) {
                setPracticeMessage('Write some code before running it.');
                return;
            }
            renderOutput(practiceEditor.value);
            setPracticeMessage('Code ran in the preview.');
        });

        document.getElementById('reset-practice').addEventListener('click', () => {
            if (!selectedProgram) return;
            practiceEditor.value = decodeCode(selectedProgram.code);
            renderOutput(practiceEditor.value);
            setPracticeMessage('Starter code restored.');
        });

        document.getElementById('show-solution').addEventListener('click', () => {
            if (!selectedProgram) return;
            practiceEditor.value = decodeCode(selectedProgram.code);
            setPracticeMessage('Solution loaded. Try changing it before running again.');
        });

        document.getElementById('refresh-output').addEventListener('click', () => {
            renderOutput(practiceMode ? practiceEditor.value : selectedProgram.code);
        });

        // Auto-load first program 
        window.onload = () => {
            if(programs.length > 0) {
                loadProgram(programs[0], document.querySelectorAll('.program-btn')[0]);
            }
        };
    </script>
</body>
</html>
